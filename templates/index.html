<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
        }
        .thumbnail {
            margin: 10px;
        }
        .thumbnail img {
            max-width: 150px;
            max-height: 150px;
        }
    </style>
</head>
<body>
    <h1>Image Gallery</h1>
    <div class="gallery">
        {% for image in images %}
            <div class="thumbnail">
                <a href="{{ image.full_image_url }}" target="_blank">
                    <img src="{{ image.thumbnail_url }}" alt="{{ image.name }}">
                </a>
            </div>
        {% endfor %}
    </div>
</body>
</html>
